name: Bug 报告
description: 功能异常、报错、样式错乱、数据读取问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认：刷新页面后问题是否仍存在；换个浏览器是否仍出现。
        涉及个人论文内容时请勿粘贴全文，用少量示例片段即可。
  - type: dropdown
    id: usage
    attributes:
      label: 使用方式
      description: 你是怎么打开这个工具的？
      options:
        - 绿色版 EXE（善驮论文工坊.exe）
        - 安装版（桌面快捷方式）
        - run.bat / serve.ps1
        - 直接打开 index.html
        - 其他静态服务器
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统 + 浏览器及版本
      placeholder: Win11 24H2 · Edge 131
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 页面底部显示的版本号
      placeholder: v0.2.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入「项目总览」新建项目
        2. 在「正文写作」粘贴 2000 字
        3. 点「质量检查」
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错请贴控制台信息（F12 → Console）
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、导出的项目 JSON（请先删掉不便公开的内容）
    validations:
      required: false
